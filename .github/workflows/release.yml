name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish as a GitHub Release; leave empty to only build artifacts."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-sidecars:
    name: Build Linux sidecars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      - run: npm ci
      - run: npm run build -w web
      - name: Build sidecars
        run: |
          CARGO_TARGET_DIR=target/cross-x86_64-unknown-linux-musl \
            cross build --release -p foco-app --target x86_64-unknown-linux-musl
          node scripts/sidecars.mjs manifest \
            --target linux-x64 \
            --binary target/cross-x86_64-unknown-linux-musl/x86_64-unknown-linux-musl/release/foco \
            --out sidecars
          CARGO_TARGET_DIR=target/cross-aarch64-unknown-linux-musl \
            cross build --release -p foco-app --target aarch64-unknown-linux-musl
          node scripts/sidecars.mjs manifest \
            --target linux-arm64 \
            --binary target/cross-aarch64-unknown-linux-musl/aarch64-unknown-linux-musl/release/foco \
            --out sidecars
          node scripts/sidecars.mjs verify \
            --root sidecars \
            --expected-targets linux-x64,linux-arm64
      - name: Upload sidecars
        uses: actions/upload-artifact@v7
        with:
          name: sidecars
          path: sidecars/
          if-no-files-found: error

  macos-release:
    name: Package macOS release
    needs: linux-sidecars
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Download sidecars
        uses: actions/download-artifact@v8
        with:
          name: sidecars
          path: sidecars
      - name: Verify sidecars
        run: node scripts/sidecars.mjs verify --root sidecars
      - name: Build dmg
        run: npm run build:macos
      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: Foco-macos-dmg
          path: dist/macos/Foco.dmg
          if-no-files-found: error

  windows-release:
    name: Package Windows release
    needs: linux-sidecars
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Download sidecars
        uses: actions/download-artifact@v8
        with:
          name: sidecars
          path: sidecars
      - name: Verify sidecars
        run: node scripts/sidecars.mjs verify --root sidecars
      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          $makensis = Join-Path $nsisDir 'makensis.exe'

          function Test-Makensis {
            return (Test-Path -LiteralPath $makensis)
          }

          if (-not (Test-Makensis)) {
            $chocoOk = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Chocolatey NSIS install attempt $attempt/3..."
              & choco install nsis -y --no-progress
              if ($LASTEXITCODE -eq 0 -and (Test-Makensis)) {
                $chocoOk = $true
                break
              }
              Write-Warning "Chocolatey install attempt $attempt failed (exit=$LASTEXITCODE)."
              Start-Sleep -Seconds (5 * $attempt)
            }

            if (-not $chocoOk) {
              # Chocolatey community feed is occasionally 503; fall back to official setup.
              $version = '3.11'
              $setup = Join-Path $env:RUNNER_TEMP "nsis-$version-setup.exe"
              $urls = @(
                "https://sourceforge.net/projects/nsis/files/NSIS%203/$version/nsis-$version-setup.exe/download",
                "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version-setup.exe"
              )
              $downloaded = $false
              foreach ($url in $urls) {
                try {
                  Write-Host "Downloading official NSIS setup from $url"
                  Invoke-WebRequest -Uri $url -OutFile $setup -UserAgent 'Wget/1.21'
                  if ((Get-Item -LiteralPath $setup).Length -gt 1MB) {
                    $downloaded = $true
                    break
                  }
                } catch {
                  Write-Warning "NSIS download failed: $_"
                }
              }
              if (-not $downloaded) {
                throw 'Failed to install NSIS via Chocolatey and official download'
              }
              $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
              if ($proc.ExitCode -ne 0) {
                throw "NSIS silent setup failed with exit code $($proc.ExitCode)"
              }
            }
          }

          if (-not (Test-Makensis)) {
            throw "makensis.exe not found at $makensis after install"
          }

          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION
      - name: Build Windows installer
        run: npm run build:windows

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: Foco-windows-setup
          path: dist/windows/Foco-windows-x64-setup.exe
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [macos-release, windows-release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" == v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi
          cargo_version="$(cargo metadata --no-deps --format-version 1 | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk); process.stdin.on("end", () => { const metadata = JSON.parse(input); const appPackage = metadata.packages.find((pkg) => pkg.name === "foco-app"); if (!appPackage?.version) process.exit(1); process.stdout.write(appPackage.version); });')"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match foco-app version $cargo_version" >&2
            exit 1
          fi
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: Foco-macos-dmg
          path: artifacts/macos
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: Foco-windows-setup
          path: artifacts/windows
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/macos/Foco.dmg "release-assets/Foco-${RELEASE_TAG}-macos-arm64.dmg"
          cp artifacts/windows/Foco-windows-x64-setup.exe "release-assets/Foco-${RELEASE_TAG}-windows-x64-setup.exe"
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes "${prerelease_flag[@]}"
          fi
